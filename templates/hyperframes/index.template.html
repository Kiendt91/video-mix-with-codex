<!doctype html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width={{WIDTH}}, height={{HEIGHT}}" />
    <script src="./gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: {{WIDTH}}px;
        height: {{HEIGHT}}px;
        overflow: hidden;
        background: #020202;
        font-family: "Oswald", Arial, sans-serif;
      }

      #root {
        position: relative;
        width: {{WIDTH}}px;
        height: {{HEIGHT}}px;
        overflow: hidden;
        background: #020202;
        color: #f3f1ea;
      }

      .video-shot {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        background: #020202;
        opacity: 0;
        will-change: opacity;
      }

      .grade,
      .black-lift,
      .vignette,
      .pulse,
      .flash,
      .chromatic,
      .fx-frame,
      .letterbox,
      .flare,
      .bloom,
      .reset-dip,
      .hud-sweep,
      .film-grain,
      .scanline,
      .title,
      .meter,
      .caption-layer,
      .caption-cue {
        position: absolute;
        pointer-events: none;
      }

      .grade {
        inset: 0;
        z-index: 20;
        background:
          radial-gradient(circle at 52% 34%, rgba(244, 232, 184, 0.14), transparent 34%),
          linear-gradient(110deg, rgba(13, 58, 50, 0.3), transparent 38%, rgba(122, 32, 18, 0.24)),
          linear-gradient(0deg, rgba(4, 4, 4, 0.16), rgba(4, 4, 4, 0.16));
        mix-blend-mode: color-dodge;
        opacity: 0.34;
      }

      #root[data-style-mode="anime_game_lyric"] .grade {
        background:
          radial-gradient(circle at 50% 26%, rgba(255, 120, 207, 0.18), rgba(255, 120, 207, 0) 34%),
          radial-gradient(circle at 58% 68%, rgba(40, 229, 255, 0.18), rgba(40, 229, 255, 0) 42%),
          linear-gradient(110deg, rgba(27, 22, 70, 0.42), rgba(10, 9, 20, 0.16) 42%, rgba(96, 18, 64, 0.28));
        mix-blend-mode: screen;
        opacity: 0.48;
      }

      #root[data-style-mode="space_battle_trailer"] .grade {
        background:
          radial-gradient(circle at 50% 22%, rgba(113, 201, 255, 0.12), rgba(113, 201, 255, 0) 34%),
          linear-gradient(100deg, rgba(7, 28, 44, 0.48), rgba(4, 6, 9, 0.16) 44%, rgba(116, 72, 34, 0.22)),
          linear-gradient(0deg, rgba(4, 5, 7, 0.2), rgba(4, 5, 7, 0.2));
        mix-blend-mode: soft-light;
        opacity: 0.78;
      }

      #root[data-style-mode="captioned_explainer"] .grade {
        background:
          radial-gradient(circle at 50% 36%, rgba(255, 241, 192, 0.2), rgba(255, 241, 192, 0) 34%),
          linear-gradient(180deg, rgba(8, 20, 34, 0.22), rgba(5, 8, 14, 0.32));
        mix-blend-mode: screen;
        opacity: 0.42;
      }

      .black-lift {
        inset: 0;
        z-index: 18;
        background:
          radial-gradient(circle at 48% 18%, rgba(130, 192, 255, 0.2), transparent 34%),
          radial-gradient(circle at 56% 88%, rgba(255, 120, 207, 0.14), transparent 42%),
          linear-gradient(180deg, rgba(28, 34, 48, 0.74), rgba(23, 28, 40, 0.7));
        mix-blend-mode: screen;
        opacity: 0.76;
      }

      .vignette {
        inset: -2px;
        z-index: 30;
        box-shadow: inset 0 0 220px 76px rgba(0, 0, 0, 0.82);
      }

      .pulse {
        inset: -10%;
        z-index: 40;
        background:
          radial-gradient(circle at 50% 50%, rgba(255, 222, 138, 0.26), transparent 20%),
          radial-gradient(circle at 50% 50%, rgba(42, 211, 158, 0.12), transparent 42%);
        mix-blend-mode: screen;
        opacity: 0;
        transform: scale(0.92);
      }

      .flash {
        inset: 0;
        z-index: 45;
        background: #f7f0cf;
        mix-blend-mode: screen;
        opacity: 0;
      }

      .chromatic {
        inset: 0;
        z-index: 46;
        opacity: 0;
        mix-blend-mode: screen;
        will-change: opacity, transform;
      }

      .chromatic-red {
        background: radial-gradient(circle at 50% 48%, rgba(255, 42, 112, 0.26), transparent 45%);
      }

      .chromatic-cyan {
        background: radial-gradient(circle at 50% 52%, rgba(40, 229, 255, 0.24), transparent 46%);
      }

      .fx-frame {
        inset: 28px;
        z-index: 52;
        border: 2px solid rgba(246, 241, 223, 0.82);
        box-shadow:
          0 0 0 1px rgba(0, 0, 0, 0.34),
          inset 0 0 42px rgba(246, 241, 223, 0.14);
        opacity: 0;
        will-change: opacity, transform;
      }

      .letterbox {
        inset: 0;
        z-index: 53;
      }

      .letterbox .bar {
        position: absolute;
        left: 0;
        width: 100%;
        height: 74px;
        background: #020202;
        transform: scaleY(0.72);
        will-change: transform;
      }

      .letterbox .bar-top {
        top: 0;
        transform-origin: top;
      }

      .letterbox .bar-bottom {
        bottom: 0;
        transform-origin: bottom;
      }

      .flare {
        left: -20%;
        right: -20%;
        top: 42%;
        z-index: 54;
        height: 5px;
        background: linear-gradient(90deg, transparent, rgba(109, 219, 255, 0.28), rgba(255, 246, 205, 0.9), rgba(255, 104, 104, 0.24), transparent);
        box-shadow:
          0 0 18px rgba(255, 245, 209, 0.8),
          0 0 64px rgba(90, 183, 255, 0.52);
        mix-blend-mode: screen;
        opacity: 0;
        will-change: opacity, transform;
      }

      .bloom {
        inset: -18%;
        z-index: 44;
        background:
          radial-gradient(circle at 50% 48%, rgba(255, 241, 192, 0.38), rgba(255, 241, 192, 0) 22%),
          radial-gradient(circle at 52% 46%, rgba(143, 232, 255, 0.2), rgba(143, 232, 255, 0) 46%);
        mix-blend-mode: screen;
        opacity: 0;
        will-change: opacity, transform;
      }

      .reset-dip {
        inset: 0;
        z-index: 47;
        background:
          radial-gradient(circle at 50% 52%, rgba(0, 0, 0, 0), rgba(0, 0, 0, 0.72) 58%),
          linear-gradient(180deg, rgba(0, 0, 0, 0.82), rgba(0, 0, 0, 0.48));
        opacity: 0;
        will-change: opacity;
      }

      .hud-sweep {
        inset: 0;
        z-index: 55;
        background:
          linear-gradient(90deg, transparent 0 46%, rgba(134, 250, 255, 0.22) 49%, rgba(255, 248, 196, 0.32) 50%, rgba(134, 250, 255, 0.18) 51%, transparent 54% 100%),
          linear-gradient(180deg, transparent 0 18%, rgba(134, 250, 255, 0.08) 18.4%, transparent 18.8% 100%);
        mix-blend-mode: screen;
        opacity: 0;
        will-change: opacity, transform;
      }

      .film-grain {
        inset: 0;
        z-index: 49;
        background:
          repeating-radial-gradient(circle at 18% 24%, rgba(255, 255, 255, 0.06) 0 1px, transparent 1px 3px),
          repeating-linear-gradient(13deg, rgba(255, 255, 255, 0.028) 0 1px, transparent 1px 6px);
        opacity: 0.08;
        mix-blend-mode: overlay;
      }

      .scanline {
        inset: 0;
        z-index: 50;
        background: repeating-linear-gradient(
          0deg,
          rgba(255, 255, 255, 0.05) 0,
          rgba(255, 255, 255, 0.05) 1px,
          transparent 1px,
          transparent 4px
        );
        opacity: 0.13;
      }

      .title {
        left: 74px;
        bottom: 82px;
        z-index: 60;
        display: grid;
        gap: 12px;
        padding: 18px 28px 20px 22px;
        background: linear-gradient(90deg, rgba(0, 0, 0, 0.72), rgba(0, 0, 0, 0.34), transparent);
        text-transform: uppercase;
        filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.8));
      }

      .kicker {
        font-size: 18px;
        font-family: "Space Mono", monospace;
        line-height: 1;
        letter-spacing: 0;
        color: #fff0a8;
        font-weight: 650;
      }

      .headline {
        font-size: 58px;
        line-height: 0.94;
        font-weight: 850;
        letter-spacing: 0;
        color: #f6f1df;
      }

      .meter {
        left: 74px;
        right: 74px;
        bottom: 44px;
        z-index: 60;
        height: 2px;
        background: rgba(246, 241, 223, 0.16);
      }

      .meter span {
        display: block;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, #c7a33a, #f4ead0, #38c69d);
        transform: scaleX(0);
        transform-origin: left;
      }

      .caption-layer {
        left: 0;
        right: 0;
        top: 0;
        bottom: 0;
        z-index: 62;
      }

      .caption-cue {
        left: 70px;
        right: 70px;
        bottom: 148px;
        display: flex;
        justify-content: center;
        text-align: center;
        opacity: 0;
        transform: translateY(20px) scale(0.98);
        will-change: opacity, transform, filter;
      }

      .caption-cue span {
        display: inline-block;
        max-width: 100%;
        padding: 16px 22px 18px;
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 8px;
        background: linear-gradient(180deg, rgba(8, 10, 14, 0.82), rgba(8, 10, 14, 0.58));
        box-shadow:
          0 18px 46px rgba(0, 0, 0, 0.46),
          inset 0 1px 0 rgba(255, 255, 255, 0.12);
        color: #fff8de;
        font-size: 42px;
        font-weight: 820;
        line-height: 1.06;
        text-transform: uppercase;
        overflow-wrap: anywhere;
        filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.7));
      }

      .caption-position-top {
        top: 130px;
        bottom: auto;
      }

      .caption-position-middle,
      .caption-position-center {
        top: 50%;
        bottom: auto;
        transform: translateY(calc(-50% + 20px)) scale(0.98);
      }

      .caption-tone-soft span {
        color: #e8f7ff;
        background: linear-gradient(180deg, rgba(10, 22, 33, 0.76), rgba(8, 12, 18, 0.48));
      }

      .caption-tone-alert span,
      .caption-tone-impact span {
        color: #101014;
        background: linear-gradient(180deg, rgba(255, 239, 166, 0.96), rgba(255, 171, 91, 0.9));
        border-color: rgba(255, 248, 210, 0.7);
      }

      @media (max-width: 1200px) {
        .caption-cue {
          left: 48px;
          right: 48px;
          bottom: 136px;
        }

        .caption-position-top {
          top: 112px;
          bottom: auto;
        }

        .caption-position-middle,
        .caption-position-center {
          top: 50%;
          bottom: auto;
        }

        .caption-cue span {
          font-size: 36px;
        }
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="{{DURATION}}"
      data-width="{{WIDTH}}"
      data-height="{{HEIGHT}}"
      data-style-mode="{{STYLE_MODE}}"
    >
      {{VIDEO_CLIPS}}
      <audio
        id="music"
        class="clip"
        data-start="0"
        data-duration="{{DURATION}}"
        data-track-index="5"
        src="./media/music.mp3"
        preload="auto"
      ></audio>

      <div class="black-lift"></div>
      <div class="grade"></div>
      <div class="vignette"></div>
      <div class="pulse"></div>
      <div class="flash"></div>
      <div class="chromatic chromatic-red"></div>
      <div class="chromatic chromatic-cyan"></div>
      <div class="bloom"></div>
      <div class="reset-dip"></div>
      <div class="flare"></div>
      <div class="hud-sweep"></div>
      <div class="fx-frame"></div>
      <div class="letterbox">
        <span class="bar bar-top"></span><span class="bar bar-bottom"></span>
      </div>
      <div class="film-grain"></div>
      <div class="scanline"></div>

      <div class="caption-layer">{{CAPTION_CLIPS}}</div>

      <div class="title">
        <div class="kicker">{{KICKER}}</div>
        <div class="headline">{{TITLE}}</div>
      </div>
      <div class="meter"><span></span></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};

      const tl = gsap.timeline({ paused: true });
      const cutTimes = {{CUT_TIMES}};
      const effectCues = {{EFFECT_CUES}};
      const flashColors = {{FLASH_COLORS}};
      const captionCues = Array.from(document.querySelectorAll(".caption-cue"));

      gsap.set(".title", { autoAlpha: 0, y: 26 });
      gsap.set(".meter span", { scaleX: 0 });
      gsap.set(".flash", { opacity: 0 });
      gsap.set(".pulse", { opacity: 0, scale: 0.94 });
      gsap.set(".chromatic-red", { opacity: 0, x: 0 });
      gsap.set(".chromatic-cyan", { opacity: 0, x: 0 });
      gsap.set(".fx-frame", { opacity: 0, scale: 1.02 });
      gsap.set(".flare", { opacity: 0, xPercent: -18, scaleX: 0.42 });
      gsap.set(".bloom", { opacity: 0, scale: 0.92 });
      gsap.set(".reset-dip", { opacity: 0 });
      gsap.set(".hud-sweep", { opacity: 0, xPercent: -42 });
      gsap.set(captionCues, { autoAlpha: 0 });

      tl.fromTo(".title", { autoAlpha: 0, y: 26 }, { autoAlpha: 1, y: 0, duration: 0.42, ease: "power3.out" }, 0.18);
      tl.to(".title", { autoAlpha: 0, y: -14, duration: 0.34, ease: "power2.in", overwrite: "auto" }, 2.36);
      tl.to(".meter span", { scaleX: 1, duration: {{DURATION}}, ease: "none" }, 0);
      tl.fromTo(".grade", { opacity: 0.26 }, { opacity: 0.42, duration: {{DURATION}}, ease: "sine.inOut" }, 0);

      cutTimes.forEach((time, index) => {
        tl.set(".flash", { backgroundColor: flashColors[index % flashColors.length] }, time - 0.02);
        tl.fromTo(".flash", { opacity: 0 }, { opacity: 0.34, duration: 0.045, ease: "none", overwrite: "auto" }, time - 0.015);
        tl.to(".flash", { opacity: 0, duration: 0.18, ease: "power2.out", overwrite: "auto" }, time + 0.035);
        tl.fromTo(".pulse", { opacity: 0.34, scale: 0.93 }, { opacity: 0, scale: 1.08, duration: 0.42, ease: "power2.out" }, time);
      });

      const videoShots = Array.from(document.querySelectorAll(".video-shot"));
      videoShots.forEach((el, index) => {
        const start = Number(el.dataset.visibleStart || el.dataset.start || 0);
        const duration = Number(el.dataset.visibleDuration || el.dataset.duration || 0);
        if (index === 0) {
          tl.set(el, { opacity: 1 }, start);
        } else {
          tl.set(el, { opacity: 1 }, Math.max(0, start - 0.04));
        }
        const next = videoShots[index + 1];
        const end = next ? Number(next.dataset.visibleStart || next.dataset.start || start + duration) : start + duration;
        tl.set(el, { opacity: 0 }, Math.max(start, end + 0.1));
      });

      captionCues.forEach((el) => {
        const start = Number(el.dataset.captionStart || 0);
        const duration = Number(el.dataset.captionDuration || 0);
        const enterDuration = Math.min(0.22, Math.max(0.08, duration * 0.24));
        const exitDuration = Math.min(0.18, Math.max(0.08, duration * 0.2));
        const isCenter = el.classList.contains("caption-position-middle") || el.classList.contains("caption-position-center");
        const fromY = isCenter ? "calc(-50% + 20px)" : 20;
        const toY = isCenter ? "-50%" : 0;
        const outY = isCenter ? "calc(-50% - 12px)" : -12;
        tl.fromTo(
          el,
          { autoAlpha: 0, y: fromY, scale: 0.98 },
          { autoAlpha: 1, y: toY, scale: 1, duration: enterDuration, ease: "power3.out", overwrite: "auto" },
          start
        );
        tl.to(
          el,
          { autoAlpha: 0, y: outY, scale: 0.985, duration: exitDuration, ease: "power2.in", overwrite: "auto" },
          Math.max(start + duration - exitDuration, start + enterDuration)
        );
      });

      function numberParam(cue, name, fallback) {
        const value = cue[name] ?? cue.params?.[name];
        const number = Number(value);
        return Number.isFinite(number) ? number : fallback;
      }

      function stringParam(cue, name, fallback) {
        return String(cue[name] ?? cue.params?.[name] ?? fallback);
      }

      function cueStart(cue) {
        return numberParam(cue, "timelineStart", numberParam(cue, "start", 0));
      }

      function shotForTime(time) {
        return videoShots.find((el) => {
          const start = Number(el.dataset.visibleStart || el.dataset.start || 0);
          const duration = Number(el.dataset.visibleDuration || el.dataset.duration || 0);
          return time >= start && time < start + duration + 0.001;
        });
      }

      function targetShot(cue, time) {
        if (cue.target && cue.target !== "global") {
          return document.getElementById(String(cue.target));
        }
        return shotForTime(time);
      }

      function captionForTime(time) {
        return captionCues.find((el) => {
          const start = Number(el.dataset.captionStart || 0);
          const duration = Number(el.dataset.captionDuration || 0);
          return time >= start && time < start + duration + 0.001;
        });
      }

      function targetCaption(cue, time) {
        if (cue.target && cue.target !== "global") {
          const element = document.getElementById(String(cue.target));
          if (element?.classList?.contains("caption-cue")) {
            return element;
          }
        }
        return captionForTime(time);
      }

      function applyEffectCue(cue) {
        const start = cueStart(cue);
        const duration = numberParam(cue, "duration", 0.28);
        const intensity = numberParam(cue, "intensity", 1);
        const color = stringParam(cue, "color", "#fff5d6");
        const type = String(cue.type || "");
        const shot = targetShot(cue, start);

        if (type === "flash-through-white") {
          tl.set(".flash", { backgroundColor: color }, start - 0.015);
          tl.fromTo(".flash", { opacity: 0 }, { opacity: 0.48 * intensity, duration: Math.min(duration * 0.36, 0.08), ease: "none", overwrite: "auto" }, start);
          tl.to(".flash", { opacity: 0, duration: Math.max(duration * 0.64, 0.12), ease: "power2.out", overwrite: "auto" }, start + Math.min(duration * 0.36, 0.08));
        } else if (type === "impact-pulse") {
          tl.fromTo(".pulse", { opacity: 0.34 * intensity, scale: 0.92 }, { opacity: 0, scale: 1.08 + 0.04 * intensity, duration, ease: "power2.out" }, start);
        } else if (type === "cinematic-zoom" && shot) {
          const scale = numberParam(cue, "scale", 1.08);
          tl.to(shot, { scale, x: numberParam(cue, "x", 0), y: numberParam(cue, "y", 0), duration, ease: "sine.inOut", overwrite: "auto" }, start);
        } else if (type === "whip-zoom" && shot) {
          const scale = numberParam(cue, "scale", 1.16);
          const peak = Math.min(duration * 0.38, 0.14);
          tl.to(shot, { scale, filter: "blur(2px)", duration: peak, ease: "power3.in", overwrite: "auto" }, start);
          tl.to(shot, { scale: 1, filter: "blur(0px)", duration: Math.max(duration - peak, 0.12), ease: "power3.out", overwrite: "auto" }, start + peak);
        } else if (type === "frame-border") {
          tl.fromTo(".fx-frame", { opacity: 0, scale: 1.04, borderColor: color }, { opacity: 0.94 * intensity, scale: 1, duration: Math.min(duration * 0.3, 0.14), ease: "power2.out" }, start);
          tl.to(".fx-frame", { opacity: 0, scale: 0.985, duration: Math.max(duration * 0.7, 0.16), ease: "power2.in" }, start + Math.min(duration * 0.3, 0.14));
        } else if (type === "chromatic-radial-split") {
          tl.fromTo(".chromatic-red", { opacity: 0, x: -10 * intensity }, { opacity: 0.56 * intensity, x: 10 * intensity, duration: duration * 0.46, ease: "power2.out" }, start);
          tl.fromTo(".chromatic-cyan", { opacity: 0, x: 10 * intensity }, { opacity: 0.5 * intensity, x: -10 * intensity, duration: duration * 0.46, ease: "power2.out" }, start);
          tl.to(".chromatic", { opacity: 0, x: 0, duration: duration * 0.54, ease: "power2.in", overwrite: "auto" }, start + duration * 0.46);
        } else if (type === "vignette-swell") {
          tl.to(".vignette", { boxShadow: "inset 0 0 300px 104px rgba(0, 0, 0, 0.92)", duration: duration * 0.5, ease: "power2.out" }, start);
          tl.to(".vignette", { boxShadow: "inset 0 0 220px 76px rgba(0, 0, 0, 0.82)", duration: duration * 0.5, ease: "power2.in" }, start + duration * 0.5);
        } else if (type === "beat-freeze" && shot) {
          tl.to(shot, { filter: "contrast(1.2) saturate(1.15)", duration: Math.min(duration, 0.18), ease: "steps(1)", overwrite: "auto" }, start);
          tl.to(shot, { filter: "none", duration: 0.12, ease: "none", overwrite: "auto" }, start + duration);
        } else if (type === "anamorphic-flare") {
          tl.set(".flare", { backgroundColor: "transparent" }, start);
          tl.fromTo(".flare", { opacity: 0, xPercent: -20, scaleX: 0.35 }, { opacity: 0.68 * intensity, xPercent: 8, scaleX: 1.08, duration: duration * 0.42, ease: "power2.out", overwrite: "auto" }, start);
          tl.to(".flare", { opacity: 0, xPercent: 26, scaleX: 0.62, duration: duration * 0.58, ease: "power2.in", overwrite: "auto" }, start + duration * 0.42);
        } else if (type === "hud-scan") {
          tl.fromTo(".hud-sweep", { opacity: 0, xPercent: -46 }, { opacity: 0.72 * intensity, xPercent: 22, duration: duration * 0.7, ease: "power1.inOut", overwrite: "auto" }, start);
          tl.to(".hud-sweep", { opacity: 0, xPercent: 46, duration: duration * 0.3, ease: "power1.in", overwrite: "auto" }, start + duration * 0.7);
        } else if (type === "shake-hit" && shot) {
          tl.to(shot, { x: -10 * intensity, y: 5 * intensity, rotation: -0.18 * intensity, duration: 0.035, ease: "none", overwrite: "auto" }, start);
          tl.to(shot, { x: 9 * intensity, y: -4 * intensity, rotation: 0.16 * intensity, duration: 0.04, ease: "none", overwrite: "auto" }, start + 0.035);
          tl.to(shot, { x: 0, y: 0, rotation: 0, duration: Math.max(duration - 0.075, 0.08), ease: "power3.out", overwrite: "auto" }, start + 0.075);
        } else if (type === "letterbox-pulse") {
          tl.to(".letterbox .bar", { scaleY: 1.18, duration: duration * 0.42, ease: "power2.out" }, start);
          tl.to(".letterbox .bar", { scaleY: 0.72, duration: duration * 0.58, ease: "power2.inOut" }, start + duration * 0.42);
        } else if (type === "negative-space-reset") {
          tl.fromTo(".reset-dip", { opacity: 0 }, { opacity: Math.min(0.82, 0.58 * intensity), duration: duration * 0.42, ease: "power3.out", overwrite: "auto" }, start);
          tl.to(".reset-dip", { opacity: 0, duration: duration * 0.58, ease: "power2.in", overwrite: "auto" }, start + duration * 0.42);
        } else if (type === "hold-bloom") {
          tl.set(".bloom", { backgroundColor: "transparent" }, start);
          tl.fromTo(".bloom", { opacity: 0, scale: 0.92 }, { opacity: Math.min(0.7, 0.36 * intensity), scale: 1.04, duration: duration * 0.5, ease: "sine.out", overwrite: "auto" }, start);
          tl.to(".bloom", { opacity: 0, scale: 1.12, duration: duration * 0.5, ease: "sine.in", overwrite: "auto" }, start + duration * 0.5);
        } else if (type === "subtitle-slam") {
          const caption = targetCaption(cue, start);
          if (caption) {
            tl.fromTo(
              caption.querySelector("span"),
              { scale: 1.08, filter: "brightness(1.4)" },
              { scale: 1, filter: "brightness(1)", duration, ease: "elastic.out(1, 0.42)", overwrite: "auto" },
              start
            );
          }
        }
      }

      effectCues.forEach(applyEffectCue);

      tl.to(".vignette", { boxShadow: "inset 0 0 260px 90px rgba(0, 0, 0, 0.88)", duration: 3.3, ease: "power2.in" }, {{FINAL_VIGNETTE_START}});
      tl.fromTo(".title", { autoAlpha: 0, y: 18 }, { autoAlpha: 1, y: 0, duration: 0.48, ease: "power3.out", overwrite: "auto" }, {{FINAL_TITLE_START}});
      tl.to(".title", { autoAlpha: 0, y: -10, duration: 0.46, ease: "power2.in", overwrite: "auto" }, {{FINAL_TITLE_END}});

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
